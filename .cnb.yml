# NPC 事件流水线 — orca-jiedan 三级链式（deepseek-v4-flash 免费模型）
# 参考: https://cnb.cool/set/npc-playground
# settings 必须与 docker/stages 同级，不能嵌套在 stages 里

.npc_task: &npc_task
  docker:
    image: cnbcool/default-codebuddy-npc:latest
  settings:
    ai_model: deepseek-v4-flash
  stages:
    - name: npc go
      type: npc:go

codex:
  issue.comment@npc: *npc_task
  pull_request.comment@npc: *npc_task

claude-code:
  issue.comment@npc: *npc_task
  pull_request.comment@npc: *npc_task
