# NPC 事件流水线 — orca-jiedan 三级链式（免费 mtga 社区镜像）
# 参考: https://cnb.cool/set/npc-playground
# mtga = docker.cnb.cool/npc/mtga:latest = 以鹅传鹅-Pro，社区免费 NPC 镜像

.npc_task: &npc_task
  - stages:
      - name: npc respond
        image: docker.cnb.cool/npc/mtga:latest

codex:
  issue.comment@npc: *npc_task
  pull_request.comment@npc: *npc_task

claude-code:
  issue.comment@npc: *npc_task
  pull_request.comment@npc: *npc_task

龙虾NPC:
  issue.comment@npc: *npc_task
  pull_request.comment@npc: *npc_task
