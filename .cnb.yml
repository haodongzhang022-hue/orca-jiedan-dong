# =============================================================================
# NPC 事件流水线 — orca-jiedan 双路径架构（A 轻量化 / B 自定义镜像容器）
# 基座：CNB 内置免费 DeepSeek-V4-Flash（npc:go 的 options.model 显式绑定）
# 触发：Issue/PR 评论中 @claude-code / @codex → 自动拉起 AI Agent 并回写评论
# 参考：https://docs.cnb.cool/zh/build/npc.md
#       https://cnb.cool/set/npc-playground
# 安全：本文件不包含任何密钥；模型鉴权通过 CNB 流水线环境变量注入
# =============================================================================
#
# 【双路径说明】
#   路径A（默认，$ 兜底）：CNB 内置 npc:go 轻量化运行时（逻辑蒸馏裁剪，开箱即用）
#   路径B（增强，claude-code 角色）：自定义 Docker 镜像 + 独立容器，完整原版
#         Claude-Code CLI + adapters/anthropic_to_cnb.py 适配层(127.0.0.1:8787)
#         + scripts/quota_monitor.py 额度监控；不蒸馏、不裁剪原生 MCP/插件/Skill。
#         hermes / codex / deepseek-harness 角色同样走路径B（独立入口脚本）。
# 切换方式：@claude-code / @hermes / @codex / @deepseek-harness → 走路径B（角色名顶层 key 覆盖 $ 兜底）；
#           @lobster 等其它角色 → 走路径A（$ 兜底 npc:go）。
# 详见 docs/claude_code_cloud_vs_local.md。
# =============================================================================

# ---- 路径B 角色配置（claude-code / hermes / codex / deepseek-harness 角色名顶层 key，随 include 合并）----
include:
  - .ci/npc-full.yml
  - .ci/hermes.yml
  - .ci/codex.yml
  - .ci/deepseek-harness.yml

# ---- 路径A 公共 NPC 任务模板（$ 兜底：所有未单独配置的角色）----
# options.model 显式绑定 CNB 内置免费 deepseek-v4-flash，确保不落到外部付费模型
# options.maxTurns 限制 Agent 轮次防失控；contextWindow 与模型对齐（128k）
.npc_task: &npc_task
  - docker:
      # 平台默认 NPC 运行镜像（免费，内置 cnb-cli / skills 等运行时）
      image: cnbcool/default-npc:latest
    env:
      # 供适配层/监控脚本使用（非 CNB_ 保留前缀）
      NPC_MODEL: deepseek-v4-flash
      REASONING_EFFORT: high
      QUOTA_LIMIT: "1600"
    stages:
      - name: npc go
        type: npc:go
        options:
          # 显式绑定 CNB 内置免费 DeepSeek-V4-Flash 基座
          model: deepseek-v4-flash
          maxTurns: 12
          contextWindow: "128k"

# ---- NPC 事件绑定 + 云原生开发环境（合并于同一 $ 兜底分支）----
# 角色在 .cnb/settings.yml 中定义：claude-code、codex、lobster
# claude-code 已被 .ci/npc-full.yml 顶层角色 key 覆盖为路径B
$:
  # ① 云原生开发：双方案并行（Hermes Web UI 6060 + DeepSeek Harness 8080）
  #    点击分支页「云原生开发」按钮 → 用 .ide/Dockerfile 构建镜像 →
  #    A. Hermes Web UI (6060): 官方 ekkoye8888/hermes-web-ui:v0.6.39
  #       WebIDE PORTS → https://{id}-6060.cnb.run
  #    B. DeepSeek Harness (8080): 轻量 Python 网关 + 企微接单 + 编排 Agent
  #       WebIDE PORTS → https://{id}-8080.cnb.run
  #    两者并行存在，共用 CNB 免费 DeepSeek-V4-Flash 网关。
  #    ⚠️ 回收机制：10分钟无操作/最长18h/凌晨4-6点强制回收
  vscode:
    - docker:
        # build 必须用对象形式并列出 by（Dockerfile 中 COPY 的文件），
        # 否则 CNB 构建上下文只有 Dockerfile 本身导致 COPY 失败 → 回退默认镜像
        build:
          dockerfile: .ide/Dockerfile
          by:
            - adapters/anthropic_to_cnb.py
            - deepseek-harness/harness_proxy.py
            - deepseek-harness/harness_agent.py
            - deepseek-harness/web_console.html
            - deepseek-harness/harness_skills.json
            - deepseek-harness/run_harness.sh
            - deepseek-harness/entrypoint.sh
            - deploy/dsh-desktop/gateway_3080.py
            - dsh-cloud/cnb_llm_adapter.py
            - dsh-cloud/host_rewrite_proxy.py
            - dsh-cloud/entrypoint.sh
            - dsh-cloud/profile-package.json
            - dsh-cloud/cordis.patch.yml
            - .ide/start.sh
        # 构建失败时的回退镜像（自带 code-server，可进 WebIDE）
        image: cnbcool/default-dev-env:latest
      runner:
        cpus: 4
      services:
        - vscode
        - docker
      stages:
        - name: verify-both-runtime
          script: |
            echo "==== 双方案运行时自检 ===="
            if [ -f /opt/deepseek-harness/harness_proxy.py ]; then
              echo "[ok] A. DeepSeek Harness 运行时已就绪 (/opt/deepseek-harness/harness_proxy.py)"
            else
              echo "[warn] A. /opt/deepseek-harness/harness_proxy.py 不存在"
            fi
            if [ -f /usr/local/bin/anthropic_to_cnb.py ]; then
              echo "[ok] B. CNB 免费网关适配层已就绪 (/usr/local/bin/anthropic_to_cnb.py)"
            else
              echo "[warn] B. /usr/local/bin/anthropic_to_cnb.py 不存在"
            fi
            exit 0
        - name: check-harness-port
          script: |
            if (echo >/dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              echo "[ok] DeepSeek Harness 网关已监听 0.0.0.0:8080"
            else
              echo "[info] 8080 未在监听，尝试兜底启动..."
              cd /opt/deepseek-harness && nohup python3 harness_proxy.py >/tmp/harness.log 2>&1 &
              sleep 3
              if (echo >/dev/tcp/127.0.0.1/8080) 2>/dev/null; then
                echo "[ok] DeepSeek Harness 网关已监听 0.0.0.0:8080（兜底）"
              else
                echo "[warn] 网关未能在 8080 监听，请查看 /tmp/harness.log"
              fi
            fi
            exit 0
        - name: check-hermes-port
          script: |
            if (echo >/dev/tcp/127.0.0.1/6060) 2>/dev/null; then
              echo "[ok] Hermes Web UI 已监听 0.0.0.0:6060"
            else
              echo "[info] 6060 未在监听（Hermes Web UI 可能仍在启动中）"
            fi
            exit 0
  # ② NPC 事件（路径A 兜底：所有未单独配置角色共用此流水线）
  issue.comment@npc: *npc_task
  pull_request.comment@npc: *npc_task

# ---- 路径B 镜像构建/推送流水线（main.push 触发，构建自定义 NPC 镜像）----
# 产物：制品库镜像 ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:1.6.0
# 注意：
#   - push 事件下 CNB_NPC_SLUG_LOWERCASE 不注入（仅 NPC 事件），必须用 CNB_REPO_SLUG_LOWERCASE
#   - 同仓库自定义 NPC 时 CNB_REPO_SLUG_LOWERCASE == CNB_NPC_SLUG_LOWERCASE，镜像引用两侧一致
#   - 仅在 Dockerfile / 适配层 / quota_monitor / entrypoint 变更时重新构建
main:
  push:
    - name: build-npc-full-image
      services:
        - docker
      ifModify:
        - adapters/Dockerfile
        - adapters/anthropic_to_cnb.py
        - adapters/hermes_entry.sh
        - scripts/quota_monitor.py
        - claude/entrypoint.sh
        - hermes/entrypoint.sh
        - deepseek-harness/harness_proxy.py
        - deepseek-harness/harness_agent.py
        - deepseek-harness/harness_skills.json
        - deepseek-harness/web_console.html
        - deepseek-harness/entrypoint.sh
      stages:
        - name: build npc full image
          script: |
            docker build \
              -f adapters/Dockerfile \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:1.6.0 \
              .
        - name: push npc full image
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:1.6.0
    # ---- dsh-desktop 可复用镜像（Docker 标准模式：先构建镜像→再由镜像实例化容器）----
    # 对齐 Hermes / OpenClaw 工程打法：镜像固化完整原版 deepseek-harness-desktop
    # 源码/依赖/环境配置，永久存放制品库；容器只是可反复生成的运行实例。
    # 版本标签 dsh-<上游版本>（当前上游 package.json version = 2.0.1）
    - name: build-dsh-desktop-image
      services:
        - docker
      ifModify:
        - deploy/dsh-desktop/Dockerfile
        - deploy/dsh-desktop/entrypoint.sh
        - deploy/dsh-desktop/gateway_3080.py
        - deepseek-harness/harness_proxy.py
        - deepseek-harness/harness_agent.py
        - deepseek-harness/harness_skills.json
        - deepseek-harness/harness_mcp_loader.py
        - deepseek-harness/harness_plugin_loader.py
        - deepseek-harness/run_harness.sh
        - deepseek-harness/config/harness_mcp_registry.json
        - deepseek-harness/config/harness_plugins.json
        - deepseek-harness/config/model_layer.json
        - deepseek-harness/plugins/gateway_3080/gateway_3080.py
        - scripts/install_mcp_plugin.sh
        - scripts/start_gateway_3080.bat
      stages:
        - name: build dsh-desktop reusable image
          script: |
            docker build \
              -f deploy/dsh-desktop/Dockerfile \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:dsh-2.0.3 \
              .
        - name: push dsh-desktop reusable image
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:dsh-2.0.3
    # ---- dsh-cloud 多 Bot 群聊界面镜像（第三层：Hermes + Harness + dsh/ds-bot）----
    # 目的：把「.ide/Dockerfile 到底能不能构建成功」这件事变成可自动验证，
    #       不再依赖人手点云原生开发才发现构建挂了。
    # 背景：上面两个 job 的 ifModify 都不含 .ide/Dockerfile 与 dsh-cloud/*，
    #       改了这些文件 push 到 main 会被静默跳过——这是 2026-10-20 查出的真缺陷。
    - name: build-dsh-cloud-image
      services:
        - docker
      ifModify:
        - .ide/Dockerfile
        - .ide/start.sh
        - dsh-cloud/cnb_llm_adapter.py
        - dsh-cloud/host_rewrite_proxy.py
        - dsh-cloud/entrypoint.sh
        - dsh-cloud/profile-package.json
        - dsh-cloud/cordis.patch.yml
        - dsh-cloud/selftest.py
        - adapters/anthropic_to_cnb.py
        - deepseek-harness/harness_proxy.py
        - deploy/dsh-desktop/gateway_3080.py
      stages:
        - name: build dsh-cloud image
          script: |
            set -e
            echo "==== 构建上下文自检（缺文件会在这里先炸，不用等 docker 报错）===="
            for f in .ide/Dockerfile .ide/start.sh \
                     dsh-cloud/entrypoint.sh dsh-cloud/cnb_llm_adapter.py \
                     dsh-cloud/host_rewrite_proxy.py dsh-cloud/profile-package.json \
                     dsh-cloud/cordis.patch.yml \
                     adapters/anthropic_to_cnb.py \
                     deepseek-harness/harness_proxy.py \
                     deploy/dsh-desktop/gateway_3080.py; do
              if [ -f "$f" ]; then echo "[ok] $f"; else echo "[FATAL] 缺文件 $f"; exit 1; fi
            done
            echo "==== docker build ===="
            docker build -f .ide/Dockerfile \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:dsh-cloud-1.0.0 .
        - name: verify image layers
          script: |
            IMG=${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:dsh-cloud-1.0.0
            echo "==== 镜像内容层校验（不只看 build 成功，要看里面真有东西）===="
            docker run --rm --entrypoint sh $IMG -c '
              echo "--- node ---"; node --version || echo "(node 缺失)"
              echo "--- dsh ---"; dsh --version || ls /usr/local/lib/node_modules/@deepseek-ai/dsh/package.json || echo "(dsh 缺失)"
              echo "--- ds-bot ---"; ls -d /root/.dsh/profiles/web/node_modules/ds-bot 2>/dev/null || echo "(ds-bot 由 entrypoint 首启安装)"
              echo "--- dsh-cloud 脚本 ---"; ls -l /opt/dsh-cloud/ 2>/dev/null || echo "(未 COPY)"
            ' || echo "[warn] 内容层校验未通过，但保留留证输出，不阻断推送"
        - name: push dsh-cloud image
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:dsh-cloud-1.0.0
