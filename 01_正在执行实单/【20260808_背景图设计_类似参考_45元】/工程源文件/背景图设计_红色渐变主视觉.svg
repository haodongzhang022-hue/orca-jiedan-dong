<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <!-- 主渐变：参考图同款 红→橙 暖色系 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A61B1B"/>
      <stop offset="30%" stop-color="#D43A1E"/>
      <stop offset="60%" stop-color="#F05A28"/>
      <stop offset="100%" stop-color="#F28C38"/>
    </linearGradient>
    <!-- 顶部高光 -->
    <radialGradient id="glowTop" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FFD9A8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFB066" stop-opacity="0"/>
    </radialGradient>
    <!-- 底部光晕 -->
    <radialGradient id="glowBottom" cx="50%" cy="92%" r="55%">
      <stop offset="0%" stop-color="#FFE3B3" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FFC27A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF9A3D" stop-opacity="0"/>
    </radialGradient>
    <!-- 大光斑 -->
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9C9" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#FFB877" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF9A4D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FFD2A0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFC08A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7F1D1D" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#A62B1B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B03A20" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blurSmall" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- 底色渐变 -->
  <rect width="1080" height="1350" fill="url(#bgGrad)"/>
  <!-- 顶部高光 -->
  <rect width="1080" height="1350" fill="url(#glowTop)"/>
  <!-- 底部光晕 -->
  <rect width="1080" height="1350" fill="url(#glowBottom)"/>

  <!-- 虚化光斑（参考图氛围） -->
  <g filter="url(#blur)">
    <ellipse cx="300" cy="240" rx="260" ry="220" fill="url(#blob2)"/>
    <ellipse cx="900" cy="330" rx="230" ry="200" fill="url(#blob1)"/>
    <ellipse cx="620" cy="1080" rx="320" ry="240" fill="url(#blob1)"/>
    <ellipse cx="140" cy="960" rx="200" ry="180" fill="url(#blob2)"/>
    <ellipse cx="980" cy="1080" rx="210" ry="190" fill="url(#blob3)"/>
  </g>

  <!-- 细颗粒柔光（小光斑） -->
  <g filter="url(#blurSmall)" opacity="0.75">
    <circle cx="180" cy="520" r="70" fill="#FFD9A8" opacity="0.5"/>
    <circle cx="880" cy="600" r="60" fill="#FFF1DC" opacity="0.5"/>
    <circle cx="520" cy="180" r="55" fill="#FFC98F" opacity="0.45"/>
    <circle cx="720" cy="1150" r="75" fill="#FFE3C0" opacity="0.4"/>
    <circle cx="340" cy="700" r="45" fill="#FFEEDB" opacity="0.35"/>
    <circle cx="950" cy="900" r="50" fill="#FFF7EC" opacity="0.35"/>
  </g>

  <!-- 装饰光晕（左上/右下） -->
  <circle cx="120" cy="120" r="180" fill="#FFFFFF" opacity="0.12" filter="url(#blurSmall)"/>
  <circle cx="960" cy="1230" r="200" fill="#FFE8C4" opacity="0.18" filter="url(#blurSmall)"/>

  <!-- 中央品牌区占位（白色内发光横线+文案槽位） -->
  <g opacity="0.92">
    <rect x="380" y="560" width="320" height="4" rx="2" fill="#FFFFFF" opacity="0.85"/>
    <rect x="300" y="800" width="480" height="4" rx="2" fill="#FFFFFF" opacity="0.85"/>
    <rect x="300" y="920" width="480" height="3" rx="1.5" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- 四角柔角装饰 -->
  <path d="M0,0 L80,0 L0,80 Z" fill="#FFFFFF" opacity="0.08"/>
  <path d="M1080,0 L1000,0 L1080,80 Z" fill="#FFFFFF" opacity="0.08"/>
  <path d="M0,1350 L80,1350 L0,1270 Z" fill="#FFFFFF" opacity="0.08"/>
  <path d="M1080,1350 L1000,1350 L1080,1270 Z" fill="#FFFFFF" opacity="0.08"/>
</svg>
