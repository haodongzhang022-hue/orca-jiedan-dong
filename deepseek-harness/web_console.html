<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Harness · 云端企业微信接单控制台</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --accent:#2f81f7; --ok:#3fb950; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px; }
  h1 { font-size:22px; margin-bottom:4px; display:flex; align-items:center; gap:10px; }
  .sub { color:#8b949e; font-size:13px; margin-bottom:20px; }
  .badge { background:var(--ok); color:#000; font-size:12px; padding:2px 8px; border-radius:10px; font-weight:600; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media(max-width:800px){ .grid{grid-template-columns:1fr;} }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .card h2 { font-size:15px; margin-bottom:12px; color:var(--accent); }
  label { display:block; font-size:12px; color:#8b949e; margin:8px 0 4px; }
  input,textarea,select { width:100%; background:#0d1117; border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:8px; font-size:13px; }
  textarea { resize:vertical; min-height:70px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:8px 16px; font-size:13px; cursor:pointer; margin-top:10px; }
  button.secondary { background:#21262d; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .out { background:#0d1117; border:1px solid var(--border); border-radius:6px; padding:10px; margin-top:10px; font-size:12px; white-space:pre-wrap; max-height:260px; overflow:auto; font-family:ui-monospace,monospace; }
  /* ---- MCP 插件可视化面板 ---- */
  .plugin { border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:12px; background:#0d1117; }
  .plugin-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .plugin-head b { color:var(--accent); font-size:14px; }
  .plugin-desc { color:#8b949e; font-size:12px; margin:6px 0; }
  .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600; }
  .tag.on { background:#1f6feb; color:#fff; }
  .tag.off { background:#21262d; color:#8b949e; }
  .tag.ok { background:var(--ok); color:#000; }
  .tag.warn { background:#d29922; color:#000; }
  .tag.err { background:#f85149; color:#fff; }
  .tag.info { background:#21262d; color:#8b949e; }
  .model-chip { display:inline-block; font-size:11px; background:#21262d; color:#8b949e; border:1px solid var(--border); border-radius:10px; padding:2px 8px; margin:2px; }
  .plugin-meta { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12px; color:#8b949e; }
  .switch { position:relative; display:inline-block; width:44px; height:24px; margin-left:auto; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; cursor:pointer; inset:0; background:#21262d; border-radius:24px; transition:.2s; }
  .slider:before { content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#8b949e; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background:#1f6feb; }
  .switch input:checked + .slider:before { transform:translateX(20px); background:#fff; }
  .plugin-detail { display:none; margin-top:10px; border-top:1px solid var(--border); padding-top:10px; font-size:12px; }
  .plugin-detail.open { display:block; }
  .model-list { margin-top:6px; }
  .btn-sm { padding:4px 10px; font-size:11px; margin:0 4px 0 0; }
  .hl { color:#2f81f7; font-weight:600; }
  .order-item { border-bottom:1px solid var(--border); padding:8px 0; font-size:13px; }
  .order-item b { color:var(--accent); }
  .stat { display:flex; gap:20px; margin-bottom:16px; font-size:13px; color:#8b949e; }
  .stat span b { color:var(--fg); font-size:20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧠 DeepSeek Harness <span class="badge">免费 DeepSeek-V4-Flash</span></h1>
  <div class="sub">云端企业微信接单 · 超级 Agent 运行时 · 非 Hermes Studio · 独立自研</div>

  <div class="stat" id="stats">
    <span>网关状态：<b id="gw">检测中…</b></span>
    <span>已接订单：<b id="cnt">0</b></span>
  </div>

  <div class="grid">
    <div class="card">
      <h2>📋 企业微信派单 → 任务卡建档</h2>
      <label>客户名</label><input id="customer" placeholder="如：汤嘉锋">
      <label>品类</label><input id="category" placeholder="如：海报/网页/PPT">
      <label>需求描述</label><textarea id="demand" placeholder="如：1080x1080 海报，暗黑科技风"></textarea>
      <label>规格/尺寸</label><input id="spec" placeholder="如：1080x1080, PSD+PNG">
      <label>结算/报价</label><input id="settle" placeholder="如：支付宝 128 元">
      <button onclick="createOrder()">接单并建档任务卡</button>
      <div class="out" id="orderOut">（等待接单…）</div>
    </div>

    <div class="card">
      <h2>🤖 对话 Harness 编排 Agent</h2>
      <label>会话 ID</label><input id="session" value="default">
      <label>任务/需求</label><textarea id="task" placeholder="让 DeepSeek Harness 规划并执行一个订单"></textarea>
      <button onclick="runHarness()">规划 → 委派 → 执行 → 汇总</button>
      <div class="out" id="agentOut">（等待编排…）</div>
    </div>
  </div>

  <div class="card" style="margin-top:20px;">
    <h2>📁 已接订单（任务卡）</h2>
    <div id="orderList">（加载中…）</div>
  </div>

  <div class="card" style="margin-top:20px;">
    <h2>🧩 MCP 插件管理 <span class="sub" id="regVersion" style="margin-left:8px;"></span></h2>
    <div class="sub">读取 <span class="hl">config/harness_mcp_registry.json</span> · 命令行链路（harness_mcp_loader.py）不受影响 · 切换即时写回注册中心</div>
    <div id="pluginList">（加载中…）</div>
  </div>
</div>

<script>
async function api(path, method='GET', body=null){
  const opt = {method, headers:{'Content-Type':'application/json'}};
  if(body) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  return r.json();
}
async function init(){
  try{
    const h = await api('/health');
    document.getElementById('gw').textContent = h.status==='ok' ? '✅ 在线 '+(h.model||'') : '⚠️ 异常';
  }catch(e){ document.getElementById('gw').textContent='❌ 无法连接'; }
  refreshOrders();
  loadPlugins();
}
async function refreshOrders(){
  try{
    const d = await api('/v1/orders/list');
    const list = d.orders||[];
    document.getElementById('cnt').textContent = list.length;
    document.getElementById('orderList').innerHTML = list.map(o=>`<div class="order-item">📄 ${o}</div>`).join('') || '（暂无）';
  }catch(e){}
}
async function createOrder(){
  const order = {
    customer: v('customer'), category: v('category'), demand: v('demand'),
    spec: v('spec'), settle: v('settle'),
    deliverables: v('demand')?[v('demand')]:[]
  };
  const d = await api('/v1/orders','POST',order);
  document.getElementById('orderOut').textContent = JSON.stringify(d, null, 2);
  refreshOrders();
}
async function runHarness(){
  const session = v('session')||'default';
  const task = v('task')||'设计一张企业宣传单';
  document.getElementById('agentOut').textContent = '正在调用 DeepSeek-Harness 编排（免费 V4-Flash）…';
  try{
    const r = await fetch(`/harness?session=${encodeURIComponent(session)}&task=${encodeURIComponent(task)}`);
    const txt = await r.text();
    document.getElementById('agentOut').textContent = txt;
  }catch(e){
    document.getElementById('agentOut').textContent = '调用失败: '+e;
  }
}
function v(id){ return document.getElementById(id).value.trim(); }

/* ========== MCP 插件可视化面板 ========== */
const tagMap = {
  on:   ['启用', 'tag.on'],   off:   ['禁用', 'tag.off'],
  ok:   ['正常', 'tag.ok'],   warn:  ['警告', 'tag.warn'],
  err:  ['异常', 'tag.err'],  unreachable:['不可达','tag.err'],
  disabled:['禁用','tag.off'], unknown:['未知','tag.info']
};
function tag(cls, label){
  const t = tagMap[cls] || [cls, 'tag.info'];
  return `<span class="tag ${t[1]}">${t[0]}</span>`;
}
function pluginCard(p){
  const models = (p.models||[]).map(m=>`<span class="model-chip">${m.id}</span>`).join('') || '';
  const modeTag = p.dual_mode ? (p.mode==='http' ? tag('warn','http') : tag('info','mcp')) : '';
  return `
  <div class="plugin" id="plugin-${p.name}">
    <div class="plugin-head">
      <b>${p.title||p.name}</b>
      <span class="tag ${p.enabled?'on':'off'}">${p.enabled?'启用':'禁用'}</span>
      ${p.dual_mode?'<span class="tag info">双模式</span>':''}
      ${modeTag}
      <span class="tag ${p.health==='ok'?'ok':(p.health==='unreachable'?'err':'info')}">健康：${p.health==='ok'?'正常':(p.health==='unreachable'?'不可达':'—')}</span>
      <label class="switch" title="${p.enabled?'禁用':'启用'} ${p.name}">
        <input type="checkbox" data-name="${p.name}" ${p.enabled?'checked':''} onchange="togglePlugin('${p.name}', this.checked)">
        <span class="slider"></span>
      </label>
    </div>
    <div class="plugin-desc">${p.desc||''}</div>
    <div class="plugin-meta">
      <span>类型：<span class="hl">${p.kind||'—'}</span></span>
      <span>模式：<span class="hl">${p.mode? (p.mode==='http'?'HTTP 网关':'MCP(stdin/stdout)'):'—'}</span></span>
      <button class="secondary btn-sm" onclick="toggleDetail('${p.name}')">详情/模型</button>
    </div>
    <div class="plugin-detail" id="detail-${p.name}">
      <div><b>生效模型清单：</b></div>
      <div class="model-list">${models || '<span class="tag info">—</span>'}</div>
      <div style="margin-top:8px;color:#8b949e;">健康详情：${p.health_detail||'—'}</div>
      <div style="margin-top:4px;color:#8b949e;">工具：${(p.name==='gateway_3080_mcp')?'chat_completions / get_models / health':'（见注册中心）'}</div>
    </div>
  </div>`;
}
async function loadPlugins(){
  const el = document.getElementById('pluginList');
  try{
    const d = await api('/plugins');
    document.getElementById('regVersion').textContent = '注册中心 v'+(d.registry_version||'—');
    el.innerHTML = (d.plugins||[]).map(pluginCard).join('') || '<div class="sub">（无插件）</div>';
  }catch(e){
    el.innerHTML = '<div class="sub">❌ 插件接口加载失败：'+e+'</div>';
  }
}
async function togglePlugin(name, enabled){
  try{
    const r = await api(`/plugins/${name}/toggle`, 'POST', {enabled});
    if(r.ok){
      await loadPlugins();
    }else{
      alert('切换失败：'+(r.error||'未知'));
      await loadPlugins();
    }
  }catch(e){
    alert('切换失败：'+e);
    await loadPlugins();
  }
}
function toggleDetail(name){
  const el = document.getElementById('detail-'+name);
  if(el) el.classList.toggle('open');
}
init();
</script>
</body>
</html>
